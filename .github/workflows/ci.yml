name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type check, build, verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check the compiled script parses
        run: node --check kemono-download-button.user.js

      - name: Check versions agree
        run: node scripts/check-version.mjs

      # @updateURL serves the committed file straight from main, so it must be the build of these sources
      - name: Check the committed script is up to date
        run: |
          if ! git diff --quiet -- kemono-download-button.user.js; then
            echo "::error file=kemono-download-button.user.js::The committed build is stale. Run npm run build and commit the result."
            git diff --stat -- kemono-download-button.user.js
            exit 1
          fi
