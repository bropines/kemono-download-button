name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check the compiled script parses
        run: node --check kemono-download-button.user.js

      - name: Check the tag names the version being built
        run: node scripts/check-version.mjs

      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      # --generate-notes appends the compare link under the changelog section
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" kemono-download-button.user.js
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes --verify-tag
