name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    name: Build UserScript & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build UserScript
        run: npm run build

      - name: Validate Compiled JavaScript Syntax
        run: |
          for f in *.user.js; do
            echo "Checking syntax for $f..."
            node -c "$f"
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kemono-download-button.user.js
            Kemono Download Button-*.user.js
            Kemono Download Button-*.txt
          generate_release_notes: true
